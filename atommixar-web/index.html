<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AtomMixAR — Loading…</title>
  <link rel="stylesheet" href="atommixar-web/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8f9fa; }
  </style>
</head>
<body>
  <span class="spinner"></span>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
  <script src="atommixar-web/js/firebase-config.js"></script>
  <script src="atommixar-web/js/auth.js"></script>
  <script>
    auth.onAuthStateChanged(user => {
      if (!user) { 
        window.location.replace("atommixar-web/login.html"); 
        return; 
      }
      AppAuth.getProfile(user.uid).then(profile => {
        window.location.replace(profile && profile.role ? "atommixar-web/" + AppAuth.dashboardFor(profile.role) : "atommixar-web/login.html");
      });
    });
  </script>
</body>
</html>
