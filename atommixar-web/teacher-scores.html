<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scores — AtomMixAR Teacher</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">AtomMixAR</div>
        <div class="brand-sub">Teacher console</div>
      </div>
    </div>
    <nav class="nav-group">
      <a class="nav-link" href="teacher-dashboard.html"><span class="dot"></span> Dashboard</a>
      <a class="nav-link" href="teacher-quizzes.html"><span class="dot"></span> Quizzes</a>
      <a class="nav-link active" href="teacher-scores.html"><span class="dot"></span> Scores</a>
      
      
      <a class="nav-link" href="teacher-reports.html"><span class="dot"></span> Reports</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="user-avatar" id="chipAvatar">?</div>
        <div class="user-meta">
          <div class="user-name" id="chipName">…</div>
          <div class="user-role" id="chipRole">…</div>
        </div>
        <button class="btn-ghost btn-sm" data-logout title="Sign out">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Scores</h1>
        <p>Results recorded by the AtomMixAR app as students finish quizzes.</p>
      </div>
      <select id="quizFilter" style="width:auto; min-width:180px">
        <option value="">All quizzes</option>
      </select>
    </div>

    <div class="stat-grid">
      <div class="stat-tile"><div class="num" id="statCount">—</div><div class="label">Results shown</div></div>
      <div class="stat-tile"><div class="num" id="statAvg">—</div><div class="label">Average score</div></div>
      <div class="stat-tile"><div class="num" id="statTop" style="font-size:1.05rem">—</div><div class="label">Top result</div></div>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <table>
        <thead><tr><th>CSC ID</th><th>Quiz</th><th>Result</th><th>Date</th><th></th></tr></thead>
        <tbody id="scoresBody"></tbody>
      </table>
      <div class="empty hidden" id="emptyState">
        <strong>No results yet</strong>
        Once students complete a quiz in the app, their scores will show up here.
      </div>
    </div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/teacher-scores.js"></script>
<script src="js/scores-util.js"></script>
</body>
</html>
