<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in — AtomMixAR</title>

	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/login.css">
	<style>
		.password-container {
			position: relative;
		}
		.password-container input {
			width: 100%;
			padding-right: 45px;
		}
		.toggle-password {
			position: absolute;
			right: 12px;
			top: 50%;
			transform: translateY(-50%);
			background: none;
			border: none;
			cursor: pointer;
			padding: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #666;
		}
		.toggle-password:hover {
			color: #000;
		}
		.toggle-password svg {
			width: 20px;
			height: 20px;
			fill: currentColor;
		}
	</style>
</head>

<body class="login-page">

	<div class="login-card">

		<div class="login-brand">
			<div class="brand-mark"></div>
			<div>
				<div class="brand-name">AtomMixAR</div>
				<div class="brand-sub">Staff Only</div>
			</div>
		</div>

		<h1>Sign in</h1>
		<p>Welcome Admins and Teachers.</p>

		<div id="loginAlert" class="alert alert-error"></div>

		<form id="loginForm">
			<div class="field">
				<label for="email">Email</label>
				<input
					type="email"
					id="email"
					required
					autocomplete="username"
				>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<div class="password-container">
					<input
						type="password"
						id="password"
						required
						autocomplete="current-password"
					>
					<button type="button" class="toggle-password" id="togglePassword" title="Show password">
						<svg id="eyeIcon" viewBox="0 0 24 24">
							<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>
						</svg>
					</button>
				</div>
			</div>

			<button type="submit" class="btn-primary" id="loginBtn">
				Sign in
			</button>
		</form>

		<div class="login-foot">
			New teacher or admin?
			<a href="register.html">Request an account</a>
		</div>

		<div
			class="login-foot"
			style="margin-top:8px; position:relative; z-index:5"
		>
			<a href="Forgotpassword.html" id="forgotLink">
				Forgot your password?
			</a>
		</div>

	</div>

	<!-- Firebase libraries -->
	<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

	<!-- Your existing Firebase configuration and authentication -->
	<script src="js/firebase-config.js"></script>
	<script src="js/auth.js"></script>

	<script>
		const form = document.getElementById("loginForm");
		const alertBox = document.getElementById("loginAlert");
		const btn = document.getElementById("loginBtn");
		const forgotLink = document.getElementById("forgotLink");
		const passwordInput = document.getElementById("password");
		const togglePasswordBtn = document.getElementById("togglePassword");
		const eyeIcon = document.getElementById("eyeIcon");

		// Open eye = password is visible. Slashed eye = password is hidden.
		const EYE_OPEN = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
		const EYE_CLOSED = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>';

		togglePasswordBtn.addEventListener("click", function () {
			const isHidden = passwordInput.type === "password";
			passwordInput.type = isHidden ? "text" : "password";
			eyeIcon.innerHTML = isHidden ? EYE_OPEN : EYE_CLOSED;
			togglePasswordBtn.title = isHidden ? "Hide password" : "Show password";
		});

		function showMessage(message, success = false) {
			alertBox.textContent = message;
			alertBox.className =
				"alert " +
				(success ? "alert-ok" : "alert-error") +
				" show";
		}

		form.addEventListener("submit", async function (e) {
			e.preventDefault();

			alertBox.classList.remove("show");
			btn.disabled = true;
			btn.textContent = "Signing in...";

			try {
				if (
					typeof AppAuth === "undefined" ||
					typeof AppAuth.login !== "function" ||
					typeof AppAuth.dashboardFor !== "function"
				) {
					throw new Error(
						"Authentication setup is missing. Check js/auth.js."
					);
				}

				await firebase.auth().setPersistence(
					firebase.auth.Auth.Persistence.LOCAL
				);

				const email = document
					.getElementById("email")
					.value.trim();

				const password = passwordInput.value;

				const role = await AppAuth.login(email, password);
				const dashboard = AppAuth.dashboardFor(role);

				if (
					typeof dashboard !== "string" ||
					dashboard.trim() === ""
				) {
					throw new Error(
						"Dashboard not configured for this account role."
					);
				}

				window.location.replace(dashboard);

			} catch (err) {
				console.error("Sign-in failed:", err);
				showMessage(
					(err.message || "Unable to sign in.")
						.replace("Firebase: ", "")
				);
				btn.disabled = false;
				btn.textContent = "Sign in";
			}
		});

		if (forgotLink) {
			forgotLink.addEventListener("click", async function (e) {
				e.preventDefault();

				const email = document
					.getElementById("email")
					.value.trim();

				if (!email) {
					showMessage("Enter your email address first.");
					document.getElementById("email").focus();
					return;
				}

				if (
					typeof AppAuth.isAllowedEmail === "function" &&
					!AppAuth.isAllowedEmail(email)
				) {
					showMessage("Please enter your allowed school email.");
					return;
				}

				try {
					await firebase.auth().sendPasswordResetEmail(email);
					showMessage(
						"If the account exists, a password reset email has been sent.",
						true
					);
				} catch (err) {
					console.error("Password reset failed:", err);
					showMessage(
						(err.message || "Unable to send reset email.")
							.replace("Firebase: ", "")
					);
				}
			});
		}
	</script>

</body>
</html>
