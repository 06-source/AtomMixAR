<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — AtomMixAR</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">AtomMixAR</div>
        <div class="brand-sub">Staff Only</div>
      </div>
    </div>

    <h1>Reset your password</h1>
    <p>Enter your school email and press <strong>Send reset link</strong>. We'll email you a link where you can choose a new password. Admins and teachers.</p>

    <div id="resetAlert" class="alert"></div>

    <form id="resetForm">
      <div class="field">
        <label for="email">School email</label>
        <input type="email" id="email" placeholder="name@cscqc.edu.ph" required autocomplete="username">
      </div>
      <button type="submit" class="btn-primary" id="sendBtn">Send reset link</button>
    </form>

    <div class="login-foot" style="position:relative;z-index:5"><a href="login.html">Back to sign in</a></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const box = $("resetAlert");
    const btn = $("sendBtn");
    let timer = null;

    const show = (msg, ok) => { box.textContent = msg; box.className = "alert " + (ok ? "alert-ok" : "alert-error") + " show"; };
    const hide = () => box.classList.remove("show");

    function friendly(err) {
      const map = {
        "auth/invalid-email": "That email address isn't valid.",
        "auth/too-many-requests": "Too many tries. Please wait a few minutes and try again.",
        "auth/network-request-failed": "Network problem. Check your connection and try again."
      };
      return map[err.code] || (err.message || "Something went wrong.").replace("Firebase: ", "");
    }

    function cooldown(secs) {
      clearInterval(timer);
      btn.disabled = true;
      timer = setInterval(() => {
        btn.textContent = "Send again (" + secs + "s)";
        if (--secs < 0) { clearInterval(timer); btn.disabled = false; btn.textContent = "Send reset link"; }
      }, 1000);
    }

    $("resetForm").addEventListener("submit", e => {
      e.preventDefault(); hide();
      const email = $("email").value.trim().toLowerCase();
      if (!AppAuth.isAllowedEmail(email)) { show("Please use your school email (" + AppAuth.ALLOWED_DOMAIN + ")."); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Sending…';

      auth.sendPasswordResetEmail(email)
        .then(() => {
          show("If that account exists, a reset link was sent to " + email + ". Check your inbox and spam folder.", true);
          cooldown(60);
        })
        .catch(err => {
          console.error("Reset error:", err);
          show(friendly(err));
          btn.disabled = false;
          btn.textContent = "Send reset link";
        });
    });
  </script>
</body>
</html>
